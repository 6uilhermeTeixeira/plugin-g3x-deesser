name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Release
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build/windows --config Release --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Test VST3 packaging
        shell: pwsh
        run: ./scripts/test-package-vst3.ps1
      - name: Package Windows VST3
        shell: pwsh
        run: ./scripts/package-vst3.ps1 -BundlePath "build/windows/G3XDeEsser_artefacts/Release/VST3/G3X DeEsser.vst3" -Destination dist
      - name: Upload Windows VST3
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: G3X-DeEsser-Windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "[Download Windows x64 VST3]($env:ARTIFACT_URL) — available for 30 days." >> $env:GITHUB_STEP_SUMMARY
          "Extract the ZIP, verify SHA256SUMS.txt, then copy the entire G3X DeEsser.vst3 folder to your VST3 directory." >> $env:GITHUB_STEP_SUMMARY
